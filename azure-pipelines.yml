trigger:
  branches:
    include:
      - main

pool:
  name: alz-p-mgmt-we-ccoe-pool

variables:
  # Supplies AZURE_SERVICE_CONNECTION, AZURE_OPENAI_ENDPOINT and the two
  # ALLOWED_IP_* ranges. There is no API key: the app authenticates with its
  # managed identity, which holds Foundry User on the account.
  #
  # AZURE_OPENAI_ENDPOINT must point at the consolidated Foundry account
  # (aif-foundry-inno-d), NOT the old shared oai-invulhulp-inno-d resource. That
  # value lives in the variable group, so changing the deployment name here
  # without changing it there points NormNet at a deployment that does not
  # exist on the old account.
  - group: normnet-secrets
  - name: APP_IMAGE
    value: normnet
  - name: RESOURCE_GROUP
    value: rg-normnet-inno-d
  - name: CONTAINER_APP_ENV
    value: cae-normnet-inno-d
  - name: APP
    value: ca-normnet-inno-d
  # One app, not two: the API serves the built SPA itself (see Dockerfile).
  # Runs are held in memory and die with the revision, so there is no storage
  # account here either — nothing in this demo outlives a restart.

stages:
  - stage: Build
    displayName: Build and push image
    jobs:
      - job: Build
        displayName: Docker build and push to ACR
        steps:
          - task: AzureCLI@2
            displayName: Build and push
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              APP_IMAGE: $(APP_IMAGE)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"
                docker build \
                  -t "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$APP_IMAGE:latest" .
                docker push "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$APP_IMAGE:latest"

  - stage: Deploy
    displayName: Deploy to Container Apps
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Deploy the app
        steps:
          - task: AzureCLI@2
            displayName: Deploy container app
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              APP_IMAGE: $(APP_IMAGE)
              APP: $(APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
                ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
                ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
                ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

                # Same deployment and API version as the invulhulp backend, so
                # both projects exercise one model rather than drifting apart.
                ENV_VARS=(
                  "AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint"
                  "AZURE_OPENAI_DEPLOYMENT=gpt-5.5"
                  "AZURE_OPENAI_API_VERSION=2025-04-01-preview"
                )

                if az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --secrets \
                      "openai-endpoint=${AZURE_OPENAI_ENDPOINT}" \
                    --output none

                  az containerapp update \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                    --min-replicas 1 \
                    --max-replicas 1 \
                    --set-env-vars "${ENV_VARS[@]}" \
                    --output none
                else
                  az containerapp create \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$CONTAINER_APP_ENV" \
                    --image "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" \
                    --registry-username "$ACR_USER" \
                    --registry-password "$ACR_PASS" \
                    --ingress external \
                    --target-port 8000 \
                    --secrets \
                      "openai-endpoint=${AZURE_OPENAI_ENDPOINT}" \
                    --env-vars "${ENV_VARS[@]}" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 1 \
                    --output none
                fi

                # A run lives in the memory of one replica and its /stream
                # connection is pinned to it, so scaling out would strand
                # clients on a replica that never saw their run. Hence
                # min=max=1 above; keep it that way until runs are shared state.

          - task: AzureCLI@2
            displayName: Apply firewall rules
            env:
              APP: $(APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              ALLOWED_IP_1: $(ALLOWED_IP_1)
              ALLOWED_IP_2: $(ALLOWED_IP_2)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az containerapp ingress access-restriction set \
                  --name "$APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --rule-name "DWR Next werkplekken" \
                  --ip-address "$ALLOWED_IP_1" \
                  --action Allow \
                  --output none
                az containerapp ingress access-restriction set \
                  --name "$APP" \
                  --resource-group "$RESOURCE_GROUP" \
                  --rule-name "ITS" \
                  --ip-address "$ALLOWED_IP_2" \
                  --action Allow \
                  --output none
