trigger:
  branches:
    include:
      - main

pool:
  name: alz-p-mgmt-we-ccoe-pool

variables:
  # AZURE_OPENAI_ENDPOINT must be aif-foundry-inno-d, not the old
  # oai-invulhulp-inno-d, or the deployment below does not exist.
  - group: normnet-secrets
  - name: APP_IMAGE
    value: normnet
  - name: APP
    value: ca-normnet-inno-d
  # Neither is ours. Both are shared, and only a registry with a private
  # endpoint can be pulled from this environment. See README.
  - name: RESOURCE_GROUP
    value: rg-platform-inno-d
  - name: CONTAINER_APP_ENV
    value: cae-platform-inno-d
  - name: CONTAINER_APP_ENV_RESOURCE_GROUP
    value: rg-platform-inno-d
  - name: ACR_LOGIN_SERVER
    value: acrfoundationinnod.azurecr.io

stages:
  - stage: Build
    displayName: Build and push image
    jobs:
      - job: Build
        displayName: Docker build and push to ACR
        steps:
          - task: AzureCLI@2
            displayName: Build and push
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              APP_IMAGE: $(APP_IMAGE)
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Admin user is disabled; this pushes as the service connection.
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"
                docker build \
                  -t "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$APP_IMAGE:latest" .
                docker push "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$APP_IMAGE:latest"

  - stage: Deploy
    displayName: Deploy to Container Apps
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Deploy the app
        steps:
          - task: AzureCLI@2
            displayName: Resolve the shared environment
            env:
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              CONTAINER_APP_ENV_RESOURCE_GROUP: $(CONTAINER_APP_ENV_RESOURCE_GROUP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                ENV_ID=$(az containerapp env show \
                  --name "$CONTAINER_APP_ENV" \
                  --resource-group "$CONTAINER_APP_ENV_RESOURCE_GROUP" \
                  --query id -o tsv 2>/dev/null || true)

                if [ -z "$ENV_ID" ]; then
                  echo "##[error]$CONTAINER_APP_ENV was not found in $CONTAINER_APP_ENV_RESOURCE_GROUP."
                  echo "##[error]This pipeline does not create an environment. Ask the platform team,"
                  echo "##[error]or point CONTAINER_APP_ENV at whatever replaced it."
                  exit 1
                fi

                # Without it every model call 403s while the app looks healthy.
                SUBNET_ID=$(az containerapp env show \
                  --name "$CONTAINER_APP_ENV" \
                  --resource-group "$CONTAINER_APP_ENV_RESOURCE_GROUP" \
                  --query "properties.vnetConfiguration.infrastructureSubnetId" -o tsv)

                if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" = "null" ]; then
                  echo "##[error]$CONTAINER_APP_ENV has no VNet integration, so Foundry is unreachable"
                  echo "##[error]from it. That cannot be fixed in place; the environment has to be"
                  echo "##[error]replaced by the platform team."
                  exit 1
                fi

                echo "##vso[task.setvariable variable=ENV_ID]$ENV_ID"

          - task: AzureCLI@2
            displayName: Deploy container app
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              APP_IMAGE: $(APP_IMAGE)
              APP: $(APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              ENV_ID: $(ENV_ID)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Same deployment and API version as the invulhulp backend.
                ENV_VARS=(
                  "AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint"
                  "AZURE_OPENAI_DEPLOYMENT=gpt-5.5"
                  "AZURE_OPENAI_API_VERSION=2025-04-01-preview"
                )

                if az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --secrets \
                      "openai-endpoint=${AZURE_OPENAI_ENDPOINT}" \
                    --output none

                  az containerapp registry set \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --server "$ACR_LOGIN_SERVER" \
                    --identity system \
                    --output none

                  az containerapp update \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                    --min-replicas 1 \
                    --max-replicas 1 \
                    --set-env-vars "${ENV_VARS[@]}" \
                    --output none
                else
                  # Internal environment: "external" is not internet-facing.
                  az containerapp create \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$ENV_ID" \
                    --image "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" \
                    --registry-identity system \
                    --ingress external \
                    --target-port 8000 \
                    --system-assigned \
                    --secrets \
                      "openai-endpoint=${AZURE_OPENAI_ENDPOINT}" \
                    --env-vars "${ENV_VARS[@]}" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 1 \
                    --output none
                fi

                PRINCIPAL_ID=$(az containerapp identity show \
                  --name "$APP" --resource-group "$RESOURCE_GROUP" \
                  --query principalId -o tsv 2>/dev/null || true)

                if [ -z "$PRINCIPAL_ID" ] || [ "$PRINCIPAL_ID" = "null" ]; then
                  PRINCIPAL_ID=$(az containerapp identity assign \
                    --name "$APP" --resource-group "$RESOURCE_GROUP" \
                    --system-assigned \
                    --query principalId -o tsv)
                fi

                # A recreated app gets a new object ID; grants do not follow.
                echo "Managed identity object ID: $PRINCIPAL_ID"
                echo "Needs AcrPull on acrfoundationinnod and Foundry User on aif-foundry-inno-d."

                echo "Ingress FQDN: $(az containerapp show \
                  --name "$APP" --resource-group "$RESOURCE_GROUP" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)"

                # A run lives in one replica's memory; /stream is pinned to it.
