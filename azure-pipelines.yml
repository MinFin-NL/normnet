trigger:
  branches:
    include:
      - main

pool:
  name: alz-p-mgmt-we-ccoe-pool

variables:
  - group: normnet-secrets
  - name: APP_IMAGE
    value: normnet
  - name: APP
    value: ca-normnet-inno-d
  - name: RESOURCE_GROUP
    value: rg-platform-inno-d
  - name: CONTAINER_APP_ENV
    value: cae-platform-inno-d
  - name: CONTAINER_APP_ENV_RESOURCE_GROUP
    value: rg-platform-inno-d
  - name: ACR_LOGIN_SERVER
    value: acrfoundationinnod.azurecr.io
  - name: IDENTITY
    value: id-normnet-inno-d
  - name: IDENTITY_RESOURCE_GROUP
    value: rg-normnet-inno-d
  - name: FOUNDRY_ACCOUNT
    value: aif-foundry-inno-d
  - name: FOUNDRY_RESOURCE_GROUP
    value: rg-foundry-inno-d
  - name: LOCATION
    value: westeurope

stages:
  - stage: Build
    displayName: Build and push image
    jobs:
      - job: Build
        displayName: Docker build and push to ACR
        steps:
          - task: AzureCLI@2
            displayName: Build and push
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              APP_IMAGE: $(APP_IMAGE)
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Admin user is disabled; this pushes as the service connection.
                az acr login --name "${ACR_LOGIN_SERVER%%.*}"
                docker build \
                  -t "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                  -t "$ACR_LOGIN_SERVER/$APP_IMAGE:latest" .
                docker push "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG"
                docker push "$ACR_LOGIN_SERVER/$APP_IMAGE:latest"

  - stage: Deploy
    displayName: Deploy to Container Apps
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Deploy the app
        steps:
          - task: AzureCLI@2
            displayName: Resolve the shared environment
            env:
              CONTAINER_APP_ENV: $(CONTAINER_APP_ENV)
              CONTAINER_APP_ENV_RESOURCE_GROUP: $(CONTAINER_APP_ENV_RESOURCE_GROUP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                ENV_ID=$(az containerapp env show \
                  --name "$CONTAINER_APP_ENV" \
                  --resource-group "$CONTAINER_APP_ENV_RESOURCE_GROUP" \
                  --query id -o tsv 2>/dev/null || true)

                if [ -z "$ENV_ID" ]; then
                  echo "##[error]$CONTAINER_APP_ENV was not found in $CONTAINER_APP_ENV_RESOURCE_GROUP."
                  echo "##[error]This pipeline does not create an environment. Ask the platform team,"
                  echo "##[error]or point CONTAINER_APP_ENV at whatever replaced it."
                  exit 1
                fi

                # Without it every model call 403s while the app looks healthy.
                SUBNET_ID=$(az containerapp env show \
                  --name "$CONTAINER_APP_ENV" \
                  --resource-group "$CONTAINER_APP_ENV_RESOURCE_GROUP" \
                  --query "properties.vnetConfiguration.infrastructureSubnetId" -o tsv)

                if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" = "null" ]; then
                  echo "##[error]$CONTAINER_APP_ENV has no VNet integration, so Foundry is unreachable"
                  echo "##[error]from it. That cannot be fixed in place; the environment has to be"
                  echo "##[error]replaced by the platform team."
                  exit 1
                fi

                echo "##vso[task.setvariable variable=ENV_ID]$ENV_ID"

          - task: AzureCLI@2
            displayName: Ensure the app identity
            env:
              IDENTITY: $(IDENTITY)
              IDENTITY_RESOURCE_GROUP: $(IDENTITY_RESOURCE_GROUP)
              LOCATION: $(LOCATION)
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              FOUNDRY_ACCOUNT: $(FOUNDRY_ACCOUNT)
              FOUNDRY_RESOURCE_GROUP: $(FOUNDRY_RESOURCE_GROUP)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # User-assigned, not system-assigned: a system identity is a new
                # principal every time the app is recreated, and every grant it
                # holds has to be reissued. This one outlives the app.
                az identity create \
                  --name "$IDENTITY" \
                  --resource-group "$IDENTITY_RESOURCE_GROUP" \
                  --location "$LOCATION" \
                  --output none

                read -r IDENTITY_ID IDENTITY_CLIENT_ID IDENTITY_PRINCIPAL_ID <<< "$(az identity show \
                  --name "$IDENTITY" --resource-group "$IDENTITY_RESOURCE_GROUP" \
                  --query "[id, clientId, principalId]" -o tsv)"

                # Granted by the pipeline, as the service connection, so that no
                # one has to file them by hand. Both are one-off in practice:
                # the identity is stable, so a second run finds them present.
                grant() {
                  if az role assignment create \
                    --assignee-object-id "$IDENTITY_PRINCIPAL_ID" \
                    --assignee-principal-type ServicePrincipal \
                    --role "$1" \
                    --scope "$2" \
                    --output none 2>/dev/null; then
                    echo "Granted $1."
                  else
                    echo "##[warning]$1 was not granted: it is already there, or this"
                    echo "##[warning]service connection cannot assign roles on $2."
                  fi
                }

                grant AcrPull \
                  "$(az acr show --name "${ACR_LOGIN_SERVER%%.*}" --query id -o tsv)"
                grant "Foundry User" \
                  "$(az cognitiveservices account show \
                       --name "$FOUNDRY_ACCOUNT" \
                       --resource-group "$FOUNDRY_RESOURCE_GROUP" \
                       --query id -o tsv)"

                echo "##vso[task.setvariable variable=IDENTITY_ID]$IDENTITY_ID"
                echo "##vso[task.setvariable variable=IDENTITY_CLIENT_ID]$IDENTITY_CLIENT_ID"

          - task: AzureCLI@2
            displayName: Deploy container app
            env:
              IMAGE_TAG: $(Build.SourceVersion)
              APP_IMAGE: $(APP_IMAGE)
              APP: $(APP)
              RESOURCE_GROUP: $(RESOURCE_GROUP)
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              ENV_ID: $(ENV_ID)
              IDENTITY_ID: $(IDENTITY_ID)
              IDENTITY_CLIENT_ID: $(IDENTITY_CLIENT_ID)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Same deployment and API version as the invulhulp backend.
                # AZURE_CLIENT_ID is what points DefaultAzureCredential at the
                # user-assigned identity rather than at nothing.
                ENV_VARS=(
                  "AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint"
                  "AZURE_OPENAI_DEPLOYMENT=gpt-5.5"
                  "AZURE_OPENAI_API_VERSION=2025-04-01-preview"
                  "AZURE_CLIENT_ID=$IDENTITY_CLIENT_ID"
                )

                if az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
                  az containerapp secret set \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --secrets \
                      "openai-endpoint=${AZURE_OPENAI_ENDPOINT}" \
                    --output none

                  az containerapp identity assign \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --user-assigned "$IDENTITY_ID" \
                    --output none

                  az containerapp registry set \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --server "$ACR_LOGIN_SERVER" \
                    --identity "$IDENTITY_ID" \
                    --output none

                  az containerapp update \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --image "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                    --min-replicas 1 \
                    --max-replicas 1 \
                    --set-env-vars "${ENV_VARS[@]}" \
                    --output none
                else
                  # Internal environment: "external" is not internet-facing.
                  az containerapp create \
                    --name "$APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --environment "$ENV_ID" \
                    --image "$ACR_LOGIN_SERVER/$APP_IMAGE:$IMAGE_TAG" \
                    --registry-server "$ACR_LOGIN_SERVER" \
                    --registry-identity "$IDENTITY_ID" \
                    --ingress external \
                    --target-port 8000 \
                    --user-assigned "$IDENTITY_ID" \
                    --secrets \
                      "openai-endpoint=${AZURE_OPENAI_ENDPOINT}" \
                    --env-vars "${ENV_VARS[@]}" \
                    --cpu 0.5 --memory 1.0Gi \
                    --min-replicas 1 --max-replicas 1 \
                    --output none
                fi

                echo "Ingress FQDN: $(az containerapp show \
                  --name "$APP" --resource-group "$RESOURCE_GROUP" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)"

                # A run lives in one replica's memory; /stream is pinned to it.
